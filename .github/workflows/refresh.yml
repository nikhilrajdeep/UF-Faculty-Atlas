name: Refresh UF faculty database

# Runs the crawler on GitHub's servers (UF sites are reachable from here), saves the database into docs/data,
# and publishes live progress to the refresh-status branch for the web app's progress bar.
# Start it from the web app's "Database updates" page (via the refresh relay), from the Actions tab, or weekly.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional test run: only departments/colleges whose name contains these words (comma-separated)"
        required: false
        default: ""
  schedule:
    - cron: "17 8 * * 0"
  push:
    branches: [claude/crawler-setup]
    paths: ["data/refresh-request.json"]

permissions:
  contents: write
  pages: write

concurrency:
  group: faculty-database
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Parser and pipeline tests
        run: python -m pytest tests -q

      - name: Choose scope
        id: scope
        env:
          INPUT_ONLY: ${{ github.event.inputs.only }}
          EVENT: ${{ github.event_name }}
        run: |
          ONLY="$INPUT_ONLY"
          if [ "$EVENT" = "push" ]; then
            ONLY=$(python -c "import json;print(json.load(open('data/refresh-request.json')).get('only',''))")
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          if [ -n "$ONLY" ]; then echo "out=data/dev-run" >> "$GITHUB_OUTPUT"; else echo "out=docs/data" >> "$GITHUB_OUTPUT"; fi

      - name: Crawl UF departments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ONLY: ${{ steps.scope.outputs.only }}
          ATLAS_OUT: ${{ steps.scope.outputs.out }}
          ATLAS_MAX_MINUTES: "300"
        run: python -m atlas.crawl

      - name: Report failure to the app
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_OUT: ${{ steps.scope.outputs.out }}
        run: python scripts/publish_status.py failed "The refresh failed. See the run log for the reason."

      - name: Validate full run
        if: steps.scope.outputs.only == ''
        run: python scripts/validate.py docs/data

      - name: Commit database
        if: steps.scope.outputs.only == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/faculty.json docs/data/students.json docs/data/coverage.json docs/data/meta.json docs/data/progress.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh UF faculty database"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ask GitHub Pages to publish the new data
        if: steps.scope.outputs.only == '' && github.ref_name == 'main'
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
