name: Refresh UF faculty database
on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * 1'
permissions:
  contents: write
concurrency:
  group: faculty-database
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check scraper syntax
        run: python -m py_compile scripts/crawl_university.py
      - name: Discover academic units and faculty profiles
        run: python scripts/crawl_university.py
        env:
          ATLAS_PAGE_BUDGET: '125'
      - name: Validate coverage and preserve existing records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('public/data/faculty.json').read_text())
          c=json.loads(Path('public/data/coverage.json').read_text())
          assert f['metadata']['total']==len(f['faculty'])
          assert len(f['faculty'])>=3000
          assert len(c['colleges'])==16
          assert len(c['departments'])>=50
          assert c['coverage_status']=='incomplete'
          print('Validated',len(f['faculty']),'records and',len(c['departments']),'academic units')
          PY
      - name: Commit database and crawl checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/faculty.json public/data/coverage.json data/crawl_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: incremental faculty discovery and coverage audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
