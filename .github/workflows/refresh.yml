name: Refresh UF faculty database

# The faculty database is rebuilt automatically about every four months.
# The workflow wakes up once a month; it only runs the crawl when the last update is at least 110 days old.
# On the other months it makes a tiny "keep-alive" commit, because GitHub switches off scheduled workflows
# in repositories with no activity for 60 days.
# To refresh right now: Actions tab -> "Refresh UF faculty database" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional test run: only departments/colleges whose name contains these words (comma-separated)"
        required: false
        default: ""
  schedule:
    - cron: "17 8 10 * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: faculty-database
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a refresh due?
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          if os.environ["EVENT"] != "schedule":
              print("due=true"); raise SystemExit
          try:
              last = datetime.fromisoformat(json.load(open("docs/data/meta.json"))["updated_at"])
              age = (datetime.now(timezone.utc) - last).days
          except Exception:
              age = 9999
          print("due=" + ("true" if age >= 110 else "false"))
          PY
      - name: Keep-alive commit (not due yet)
        if: steps.due.outputs.due != 'true'
        run: |
          git config user.name "Nikhil Raj Deep"
          git config user.email "nikhilrajdeep@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled refresh active"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  refresh:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Choose scope
        id: scope
        env:
          INPUT_ONLY: ${{ github.event.inputs.only }}
        run: |
          echo "only=$INPUT_ONLY" >> "$GITHUB_OUTPUT"
          # test runs (word filter) write to a scratch folder and never touch the real database
          if [ -n "$INPUT_ONLY" ]; then echo "out=data/dev-run" >> "$GITHUB_OUTPUT"; else echo "out=docs/data" >> "$GITHUB_OUTPUT"; fi

      - name: Crawl UF departments
        env:
          ATLAS_ONLY: ${{ steps.scope.outputs.only }}
          ATLAS_OUT: ${{ steps.scope.outputs.out }}
          ATLAS_MAX_MINUTES: "300"
        run: |
          set -o pipefail
          python -m atlas.crawl 2>&1 | tee "$RUNNER_TEMP/crawl.log"

      - name: Validate full run
        if: steps.scope.outputs.out == 'docs/data'
        run: python scripts/validate.py docs/data

      - name: Commit database
        if: steps.scope.outputs.out == 'docs/data'
        run: |
          git config user.name "Nikhil Raj Deep"
          git config user.email "nikhilrajdeep@users.noreply.github.com"
          git add docs/data/faculty.json docs/data/coverage.json docs/data/meta.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh UF faculty database"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ask GitHub Pages to publish the new data
        if: steps.scope.outputs.out == 'docs/data' && github.ref_name == 'main'
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
